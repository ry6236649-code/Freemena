<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IMRANE - لعبة الثورة الصناعية السحرية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #050508; color: #fff; font-family: sans-serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { background: rgba(15, 15, 25, 0.9); border: 2px solid #ff4500; border-radius: 10px; padding: 10px 20px; display: flex; gap: 20px; font-weight: bold; }
        .stat-val { font-size: 1.4rem; color: #ff8c00; text-align: center; }
        .stat-lbl { font-size: 0.75rem; color: #aaa; text-align: center; }
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; text-align: center; padding: 20px; }
        .btn-start { background: linear-gradient(135deg, #ff4500, #ff8c00); border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; color: #fff; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(255,69,0,0.6); margin-top: 20px; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; pointer-events: none; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; }
        .controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #00ffff; font-size: 0.9rem; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div id="game-container">
    <div class="crosshair"></div>
    <div class="hud">
        <div class="top-bar">
            <div class="stats-box">
                <div><div class="stat-val" id="score">0</div><div class="stat-lbl">النقاط</div></div>
                <div><div class="stat-val" id="hp">100</div><div class="stat-lbl">الطاقة</div></div>
            </div>
        </div>
        <div class="controls-hint">تحرك بـ W A S D أو أسهم لوحة المفاتيح وانقر لإطلاق النار</div>
    </div>

    <div class="screen-overlay" id="start-screen">
        <h1 style="font-size: 2.5rem; color: #ff4500; text-shadow: 0 0 15px rgba(255,69,0,0.6);">المتسلل IMRANE</h1>
        <p style="color: #aaa; margin-top: 15px; max-width: 400px;">عالم الثورة الصناعية السحرية - تحالف الفولاذ ضد ترتيب الضباب</p>
        <button class="btn-start" onclick="startGame()">بدء المهمة</button>
    </div>
</div>

<script>
let scene, camera, renderer;
let player, enemies = [], bullets = [];
let keys = {};
let score = 0, health = 100;
let isPlaying = false;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('game-container').appendChild(renderer.domElement);

    // إضاءة عالم الأثير
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x00ffff, 1.5);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // الأرضية
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x11111a, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const grid = new THREE.GridHelper(300, 50, 0xff4500, 0x222233);
    grid.position.y = 0.02;
    scene.add(grid);

    // شخصية imrane (Full Black Stealth Suit)
    player = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.5 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16), bodyMat);
    body.position.y = 0.75;
    
    const headMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), headMat);
    head.position.y = 1.6;
    
    player.add(body, head);
    scene.add(player);

    // إنشاء أعداء تحالف الفولاذ
    spawnEnemies(8);

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('resize', onWindowResize);
    document.addEventListener('click', fireWeapon);

    camera.position.set(0, 3, 5);
}

function spawnEnemies(count) {
    for (let i = 0; i < count; i++) {
        const botMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const bot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16), botMat);
        bot.position.set((Math.random() - 0.5) * 120, 0.75, (Math.random() - 0.5) * 120);
        bot.userData = { hp: 50, speed: 0.04 + Math.random() * 0.03 };
        scene.add(bot);
        enemies.push(bot);
    }
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    isPlaying = true;
    animate();
}

function fireWeapon() {
    if (!isPlaying) return;
    const bGeo = new THREE.SphereGeometry(0.12, 8, 8);
    const bMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const bullet = new THREE.Mesh(bGeo, bMat);
    
    bullet.position.copy(player.position);
    bullet.position.y += 1.2;
    bullet.userData = { dir: new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion) };
    
    scene.add(bullet);
    bullets.push(bullet);
}

function animate() {
    if (!isPlaying) return;
    requestAnimationFrame(animate);

    // حركة اللاعب
    const moveSpeed = 0.15;
    if (keys['w'] || keys['arrowup']) player.translateZ(-moveSpeed);
    if (keys['s'] || keys['arrowdown']) player.translateZ(moveSpeed);
    if (keys['a'] || keys['arrowleft']) player.rotation.y += 0.04;
    if (keys['d'] || keys['arrowright']) player.rotation.y -= 0.04;

    // تتبع الكاميرا
    camera.position.x = player.position.x + Math.sin(player.rotation.y) * 4;
    camera.position.z = player.position.z + Math.cos(player.rotation.y) * 4;
    camera.position.y = player.position.y + 2.5;
    camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

    // حركة الأعداء نحوك
    enemies.forEach((bot, index) => {
        bot.lookAt(player.position);
        bot.translateZ(bot.userData.speed);

        if (bot.position.distanceTo(player.position) < 1.2) {
            health -= 0.5;
            document.getElementById('hp').innerText = Math.max(0, Math.floor(health));
        }
    });

    // تحديث الرصاص والاصطدامات
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.addScaledVector(b.userData.dir, 1.2);

        enemies.forEach((bot, bIdx) => {
            if (b.position.distanceTo(bot.position) < 1.0) {
                scene.remove(bot);
                enemies.splice(bIdx, 1);
                scene.remove(b);
                bullets.splice(i, 1);
                
                score += 10;
                document.getElementById('score').innerText = score;
                
                // إعادة توليد عدو جديد لضمان استمرار اللعب
                setTimeout(() => spawnEnemies(1), 1000);
            }
        });

        if (b && b.position.length() > 200) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
