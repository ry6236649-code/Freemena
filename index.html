<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire - استبدال الأكواد والمكافآت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            line-height: 1.6;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(15, 15, 19, 0.9);
            border-bottom: 2px solid #ff4500;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
            background: linear-gradient(180deg, rgba(255, 69, 0, 0.1) 0%, rgba(15, 15, 19, 1) 100%);
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        .hero p {
            font-size: 1.1rem;
            color: #a0a0a0;
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .card {
            background: #1a1a24;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a3a;
            width: 100%;
            max-width: 450px;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ff4500;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f0f13;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus {
            border-color: #ff4500;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">FREE FIRE</div>
    </nav>
    <div class="hero">
        <h1>استبدال أكواد الجواهر</h1>
        <p>قم بإدخال معرف اللاعب (Player ID) الخاص بك واستبدل الأكواد للحصول على المكافآت مباشرة في حسابك.</p>
        <div class="card">
            <div class="form-group">
                <label for="playerId">معرف اللاعب (Player ID):</label>
                <input type="text" id="playerId" placeholder="أدخل الأيدي هنا...">
            </div>
            <div class="form-group">
                <label for="rewardCode">كود المكافأة:</label>
                <input type="text" id="rewardCode" placeholder="أدخل الكود هنا...">
            </div>
            <button class="btn-submit" onclick="alert('تم إرسال الطلب بنجاح! سيتم إضافة المكافأة لحسابك قريبًا.')">تأكيد الاستبدال</button>
        </div>
    </div>
</body>
</html>
