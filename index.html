<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FREE FIRE - 3D Battle Royale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #050508; color: #fff; font-family: sans-serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* UI Overlay */
        .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { background: rgba(15, 15, 25, 0.85); border: 1px solid #ff4500; border-radius: 8px; padding: 10px 18px; display: flex; gap: 20px; font-weight: bold; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 1.4rem; color: #ff8c00; }
        .stat-lbl { font-size: 0.75rem; color: #aaa; }
        
        .radar-box { width: 110px; height: 110px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #ff4500; position: relative; overflow: hidden; }
        
        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .health-bar-container { width: 250px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .bar { height: 12px; border-radius: 6px; margin-top: 4px; background: #222; overflow: hidden; }
        .bar-fill-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00b359); transition: width 0.2s; }
        
        .weapon-box { background: rgba(15, 15, 25, 0.85); border: 1px solid #ff4500; border-radius: 8px; padding: 12px 20px; text-align: center; }
        .ammo-count { font-size: 1.6rem; font-weight: bold; color: #fff; }
        
        /* Start & Game Over Screen */
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        .btn-start { background: linear-gradient(135deg, #ff4500, #ff8c00); border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; color: #fff; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255,69,0,0.5); margin-top: 20px; }
        .btn-start:hover { transform: scale(1.05); }

        /* Crosshair */
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #ff4500; }
        .crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        .crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="crosshair"></div>
    <div class="hud">
        <div class="top-bar">
            <div class="stats-box">
                <div class="stat-item"><div class="stat-val" id="alive-count">10</div><div class="stat-lbl">الأحياء</div></div>
                <div class="stat-item"><div class="stat-val" id="kill-count">0</div><div class="stat-lbl">القتلى</div></div>
            </div>
            <div class="radar-box"></div>
        </div>
        <div class="bottom-bar">
            <div class="health-bar-container">
                <span style="font-size:0.8rem; color:#00ff88; font-weight:bold;">الصحة (HP)</span>
                <div class="bar"><div class="bar-fill-hp" id="hp-bar"></div></div>
            </div>
            <div class="weapon-box">
                <div style="color:#ff8c00; font-size:0.8rem; font-weight:bold;">سلاح الرشاش</div>
                <div class="ammo-count"><span id="ammo-clip">30</span> / <span id="ammo-total">120</span></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="screen-overlay" id="start-screen">
        <h1 style="font-size: 3rem; color: #ff4500; text-shadow: 0 0 20px rgba(255,69,0,0.6);">FREE FIRE 3D</h1>
        <p style="color: #aaa; margin-top: 10px;">استخدم الأسهم أو WASD للحركة، والماوس للتصويب وإطلاق النار</p>
        <button class="btn-start" onclick="startGame()">ابدأ المعركة</button>
    </div>
</div>

<script>
let scene, camera, renderer;
let player, enemies = [];
let bullets = [];
let keys = {};
let kills = 0, alive = 10, hp = 100;
let isPlaying = false;

function init() {
    // Scene setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('game-container').appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 40, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040, 1.5));

    // Ground
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Grid helper
    const grid = new THREE.GridHelper(200, 40, 0xff4500, 0x333344);
    grid.position.y = 0.01;
    scene.add(grid);

    // Player (Capsule body + Head)
    player = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.6, 16), bodyMat);
    body.position.y = 0.8;
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), headMat);
    head.position.y = 1.8;
    player.add(body, head);
    scene.add(player);

    // Create Enemies (Bots)
    createEnemies(9);

    // Controls listeners
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('resize', onWindowResize);
    document.addEventListener('click', shootBullet);

    camera.position.set(0, 2.5, 4);
}

function createEnemies(count) {
    for (let i = 0; i < count; i++) {
        const bot = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x0088ff });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.6, 16), mat);
        body.position.y = 0.8;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), mat);
        head.position.y = 1.8;
        bot.add(body, head);

        // Random position
        bot.position.x = (Math.random() - 0.5) * 160;
        bot.position.z = (Math.random() - 0.5) * 160;
        bot.userData = { hp: 100, speed: 0.05 + Math.random() * 0.03 };
        
        scene.add(bot);
        enemies.push(bot);
    }
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    isPlaying = true;
    animate();
}

function shootBullet() {
    if (!isPlaying) return;
    const bMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const bGeo = new THREE.SphereGeometry(0.15, 8, 8);
    const bullet = new THREE.Mesh(bGeo, bMat);
    
    bullet.position.set(player.position.x, player.position.y + 1.2, player.position.z);
    bullet.userData = { dir: new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion) };
    
    scene.add(bullet);
    bullets.push(bullet);
}

function updateBots() {
    enemies.forEach((bot, idx) => {
        // Move towards player
        const dir = new THREE.Vector3().subVectors(player.position, bot.position).normalize();
        bot.position.addScaledVector(dir, bot.userData.speed);
        bot.lookAt(player.position.x, bot.position.y, player.position.z);

        // Hit player check
        if (bot.position.distanceTo(player.position) < 1.2) {
            hp -= 0.2;
            document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
        }
    });
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.addScaledVector(b.userData.dir, 1.2);

        // Check collision with enemies
        enemies.forEach((bot, bIdx) => {
            if (b.position.distanceTo(bot.position) < 1.0) {
                bot.userData.hp -= 50;
                scene.remove(b);
                bullets.splice(i, 1);

                if (bot.userData.hp <= 0) {
                    scene.remove(bot);
                    enemies.splice(bIdx, 1);
                    kills++;
                    alive--;
                    document.getElementById('kill-count').innerText = kills;
                    document.getElementById('alive-count').innerText = alive;
                }
            }
        });

        // Remove out of bounds bullets
        if (b && b.position.length() > 200) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }
}

function animate() {
    if (!isPlaying) return;
    requestAnimationFrame(animate);

    // Player movement
    const speed = 0.15;
    if (keys['w'] || keys['arrowup']) player.translateZ(-speed);
    if (keys['s'] || keys['arrowdown']) player.translateZ(speed);
    if (keys['a'] || keys['arrowleft']) player.rotation.y += 0.04;
    if (keys['d'] || keys['arrowright']) player.rotation.y -= 0.04;

    // Camera follow player
    camera.position.x = player.position.x + Math.sin(player.rotation.y) * 4;
    camera.position.z = player.position.z + Math.cos(player.rotation.y) * 4;
    camera.position.y = player.position.y + 2.5;
    camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

    updateBots();
    updateBullets();

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
